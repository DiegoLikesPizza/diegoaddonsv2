plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/diegoaddonsv2.accesswidener")
}

repositories {
    // Loom adds the essential maven repositories automatically, and configlib comes from the
    // composite build in settings.gradle - so there is nothing else to declare here.
}

dependencies {
    // MC 26.x is shipped de-obfuscated (Mojang names), so no `mappings` entry is needed
    // or allowed - Loom uses the game's own names directly. This matches the official
    // FabricMC/fabric-example-mod (master) template for 26.1.2.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // configlib - the config GUI, the HUD manager and (via :menu) the custom title screen. Resolved
    // from the composite build in settings.gradle, so this coordinate is the local working copy.
    implementation(include("dev.diego:configlib:1.0.0"))
    implementation(include("dev.diego:configlib-menu:1.0.0"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
