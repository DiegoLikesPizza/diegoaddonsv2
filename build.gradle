plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    accessWidenerPath = file("src/main/resources/diegoaddonsv2.accesswidener")
}

repositories {
    // Loom adds the essential maven repositories automatically.
    maven {
        name = "RenderLib"
        url = "https://renderlib.ifallious.com/maven"
        content { includeGroup "com.render" }
    }
}

dependencies {
    // MC 26.x is shipped de-obfuscated (Mojang names), so no `mappings` entry is needed
    // or allowed - Loom uses the game's own names directly. This matches the official
    // FabricMC/fabric-example-mod (master) template for 26.1.2.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // RenderLib - retained GUI / HUD / world rendering (jar-in-jar bundled).
    implementation(include("com.render:render-lib:2.1.4"))
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
