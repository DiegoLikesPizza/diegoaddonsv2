# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Loom is not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric / Minecraft versions for MC 26.1.2
# Verified against the official FabricMC/fabric-example-mod (master) template.
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Fabric API
fabric_api_version=0.154.2+26.1.2

# Mod
# 2.0.x counts the passes over the feature list; 2.1 is the first release worth handing to anyone
# else. Bump the patch on every build that goes to the test instance, so a jar can always be traced
# back to what was in it.
mod_version=2.0.22
maven_group=dev.diego
archives_base_name=diegoaddonsv2
